  product:{label:'🛍️ 商品推薦',questions:[
    {kind:'商品推薦',goal:'讓觀眾想知道產品差異',scenario:'你比較兩款容量不同、價格接近的保溫瓶。',a:'這兩款保溫瓶都很不錯，今天來跟大家分享我的使用心得。',b:'同樣 1,000 元，這兩款保溫瓶差在容量和重量，你會選哪個？',best:'b',why:'第二句直接交代比較條件，也把選擇問題留給觀眾。第一句只有「都不錯」，還看不出這篇能幫忙解決什麼問題。',clues:['比較條件','觀眾需求','互動問題'],lesson:'商品推薦要以真實體驗和清楚條件為基礎，避免只有稱讚、沒有可驗證資訊。'},
    {kind:'商品推薦',goal:'讓觀眾想知道值不值得買',scenario:'你試用一台價格不低的隨身咖啡機。',a:'這台隨身咖啡機外型很好看，我很喜歡它的設計。',b:'一台 4,000 元的隨身咖啡機，我帶出門一週後最常用的功能是這個。',best:'b',why:'第二句交代價格、實際使用時間，並預告一個具體觀察。觀眾可以評估這則分享和自己的購買考量有沒有關係。',clues:['價格資訊','真實使用','具體發現'],lesson:'分享使用心得時說明測試時間、使用條件與個人偏好，避免把個人感受說成普遍結論。'},
    {kind:'商品推薦',goal:'讓讀者想收藏選購建議',scenario:'你整理三款不同價位的行動電源。',a:'行動電源有很多款，今天整理幾個我覺得不錯的推薦給大家。',b:'買行動電源先看這 2 件事：你每天帶出門的重量，可能比容量更重要。',best:'b',why:'第二句先給選購標準，再用意料之外的比較抓住注意力。讀者知道這篇不是單純列商品，而是會幫他做選擇。',clues:['決策標準','反差觀點','實用價值'],lesson:'規格和安全資訊要以產品標示與可靠資料為準，推薦也要說明適用情境。'}
  ]},
  family:{label:'👨‍👩‍👧 親子生活',questions:[
    {kind:'親子生活',goal:'讓家長想收藏一個可用的方法',scenario:'你分享一個出門前準備孩子用品的小方法。',a:'帶小孩出門之前，我會先把東西整理好，這樣比較不容易忘記。',b:'帶兩個小孩出門，我把必帶物分成 3 袋，出門前不用再翻整個包包。',best:'b',why:'第二句把方法說得更具體：兩個孩子、三袋、解決翻包包。讀者能快速判斷這個方法是否適合自己，也更容易收藏。',clues:['方法具體','降低麻煩','容易收藏'],lesson:'可以分享自己的做法，但不必暗示每個家庭都適用；把前提說清楚，反而更有參考價值。'},
    {kind:'親子生活',goal:'讓家長想知道孩子的反應',scenario:'你拍一段和孩子一起做簡單點心的過程。',a:'今天和孩子一起做點心，過程很有趣也很開心。',b:'我只準備了 3 種材料，結果孩子把最後一步變成自己的作品。',best:'b',why:'第二句用簡單材料和意料之外的結果，讓人想看孩子究竟做了什麼。第一句告訴讀者「很開心」，但畫面還沒有出現。',clues:['具體材料','意外結果','想看畫面'],lesson:'拍攝孩子前要考量孩子意願與隱私，避免公開可識別的個人資訊。'},
    {kind:'親子生活',goal:'讓照顧者感到被理解',scenario:'你想寫一篇關於帶孩子出門很累的貼文。',a:'帶孩子出門其實很辛苦，很多爸媽都會有同樣的感覺。',b:'到了公園才發現忘記帶水壺，我一邊找便利商店，一邊安慰快哭的孩子。',best:'b',why:'第二句用一個常見但具體的意外，讓照顧者能感覺「這我也遇過」。第一句直接說大家都辛苦，卻還沒有呈現那份辛苦長什麼樣子。',clues:['日常細節','具體情緒','共感場景'],lesson:'描述孩子或家人時注意隱私；共鳴不必靠曝光他們的尷尬時刻。'}
  ]}
};
const categories=Object.entries(questionBank);let selectedCategory='all',questions=[],current=0,score=0,answered=[];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function renderCategories(){ $('#categories').innerHTML=categories.map(([id,c])=>`<button class="category ${id===selectedCategory?'active':''}" data-category="${id}">${c.label}</button>`).join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>start(b.dataset.category)); }
function start(id=selectedCategory){selectedCategory=id;const pool=questionBank[id].questions;questions=shuffle(pool).slice(0,Math.min(5,pool.length));current=0;score=0;answered=[];renderCategories();renderQuestion();}
function updateBar(){const max=questions.length*10;$('#level').textContent=`${questionBank[selectedCategory].label}　${Math.min(current+1,questions.length)} / ${questions.length}`;$('#points').textContent=`🌟 本回合 ${score} / ${max} 分`;}
function renderQuestion(){updateBar();const q=questions[current];$('#screen').className='card';$('#screen').innerHTML=`<div class="eyebrow">第 ${current+1} 題 · ${esc(q.kind)}｜目標：${esc(q.goal)}</div><h2>哪一個開場，更容易讓目標觀眾停下來？</h2><p class="sub">先讀情境，再選你認為更有效的一句。</p><div class="scenario">📝 情境：${esc(q.scenario)}</div><div class="choices"><button class="choice" data-pick="a"><span class="letter">A</span><span class="copy">${esc(q.a)}</span><span class="hint">點一下，選擇這個開場</span></button><button class="choice" data-pick="b"><span class="letter">B</span><span class="copy">${esc(q.b)}</span><span class="hint">點一下，選擇這個開場</span></button></div><div id="feedback"></div><div class="actions"><button class="btn secondary" id="skip">先跳過</button><button class="btn" id="next" disabled>${current===questions.length-1?'看本回合成績':'下一題 →'}</button></div>`;
document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>answer(btn.dataset.pick));$('#skip').onclick=()=>advance(true);$('#next').onclick=()=>current===questions.length-1?renderResult():advance(false);}
function answer(pick){if(answered[current])return;const q=questions[current],correct=pick===q.best;answered[current]=true;if(correct)score+=10;document.querySelectorAll('[data-pick]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.pick===q.best);b.classList.toggle('wrong',b.dataset.pick===pick&&!correct);b.classList.toggle('selected',b.dataset.pick===pick)});$('#feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><h3>${correct?'🌟 答對了！觀察力 +10':'🌱 這題先記下一個線索'}</h3><p><b>這題選 ${q.best.toUpperCase()}：</b>${esc(q.why)}</p><p><b>小提醒：</b>${esc(q.lesson)}</p>${q.clues.map(x=>`<span class="clue">${esc(x)}</span>`).join('')}</div>`;$('#points').textContent=`🌟 本回合 ${score} / ${questions.length*10} 分`;$('#next').disabled=false;$('#skip').textContent='看解析';}
function advance(skipped){if(skipped&&!answered[current]){answered[current]=false;score=Math.max(0,score)}current++;renderQuestion();}
function renderResult(){updateBar();$('#screen').className='card result';const max=questions.length*10,pct=Math.round(score/max*100),right=score/10;let title=pct===100?'觀察力滿點！你很會抓住文案線索。':pct>=60?'很棒，你已經抓到幾個重要線索。':'小島練習完成，文案判斷力會越玩越準。';let feedback=pct===100?'你能辨認具體情境、清楚承諾和觀眾需求。創作時再把這些線索換成自己的真實素材。':pct>=60?'你已經能看到部分開場差異。再留意：觀眾是誰、這句話給了什麼理由讓他繼續看。':'先不用急著追求「神句」。練習把抽象說法換成具體情境，讓觀眾知道內容和自己有什麼關係。';$('#screen').innerHTML=`<div class="eyebrow">🏁 本回合完成</div><h2>${title}</h2><div class="score">${score}<small>本回合分數</small></div><p>${feedback}</p><div class="result-grid"><div class="result-tile"><strong>${right} / ${questions.length}</strong><span>答對題數</span></div><div class="result-tile"><strong>${pct}%</strong><span>本回合得分率</span></div><div class="result-tile"><strong>${questionBank[selectedCategory].label}</strong><span>練習類別</span></div></div><div class="note"><b>🌿 冒牌生的小島筆記</b><br>爆款沒有固定公式，只有更符合「內容目標、觀眾情境、真實素材」的選擇。今天的分數是練習回饋，不是你寫文案能力的定論。</div><div class="actions"><button class="btn secondary" id="change">換個主題</button><button class="btn gold" id="again">再玩一回合 ↻</button></div>`;$('#change').onclick=()=>{document.querySelector('#categories').scrollIntoView({behavior:'smooth',block:'center'});};$('#again').onclick=()=>start(selectedCategory);}
renderCategories();start('all');
</script></body></html>
