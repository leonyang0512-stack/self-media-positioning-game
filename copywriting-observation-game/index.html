    {kind:'專業知識',goal:'讓上班族想知道報稅常見錯誤',scenario:'你要做一篇新手報稅提醒，希望讀者覺得和自己有關。',a:'報稅時很多人都會遇到一些問題，今天整理幾個常見的狀況。',b:'明明有扶養家人，報稅時卻漏掉這一項？先檢查你的資料。',best:'b',why:'第二句先放進具體情境，再指出可能漏看的細節，讀者能立刻對照自己。第一句雖然清楚，但範圍太大，還沒有給出停留理由。',clues:['生活情境','對照自身','明確細節'],lesson:'稅務規則可能變動，正式發布前要確認最新規定，也要說清楚適用條件。'},
    {kind:'個人故事',goal:'讓正在自我懷疑的人願意讀下去',scenario:'你想分享自己曾經不敢開始創作的經驗。',a:'我以前也覺得自己沒有什麼特別，直到有一天我做了一件小事。',b:'我發第一篇貼文時只有 12 個讚，還一直重整頁面看有沒有人回覆。',best:'b',why:'第二句用數字和動作還原一個具體瞬間，讀者容易看見那個畫面，也可能想起自己的經驗。第一句有情緒方向，但比較像摘要。',clues:['具體細節','可想像畫面','情緒共鳴'],lesson:'個人故事不必把每個細節都放上網，分享前也可以先確認自己舒服的界線。'},

    {kind:'勞保勞退案例標題',goal:'讓準備退休或替父母留意權益的人停下來',scenario:'你要分享媽媽領取勞保、勞退給付時發現金額落差的真實案例。',a:'勞保勞退要注意哪些事情？今天整理給大家。',b:'我媽媽繳了 30 年勞保勞退，卻少領 30 萬！',best:'b',why:'第二句把親身案例、累積時間和具體金額放在一起，讀者很快能理解事件的重量，也會想知道少領的原因。第一句雖然明確，卻還沒有說明為什麼此刻值得看。',clues:['真實人物','累積時間','具體金額'],lesson:'「少領 30 萬」要能用實際給付紀錄與計算方式核實，並說明制度、個人條件和資料來源。'},

    {kind:'保險理賠標題',goal:'讓有保單的人想檢查保障內容',scenario:'你分享一個理賠前才發現保障範圍不同的真實案例。',a:'買保險前一定要仔細看清楚保單內容。',b:'保單繳了 20 年，理賠時才發現這項不賠？先看保障範圍。',best:'b',why:'第二句用繳費時間和發現問題的時刻建立具體情境，也給觀眾明確檢查方向。它比一般提醒更容易讓人想到自己手上的保單。',clues:['長期投入','關鍵時刻','可執行提醒'],lesson:'保險責任依條款、投保時間和個案情況而異；引用理賠案例時要保護個資並核對保單條款。'},
    {kind:'房地產權益標題',goal:'讓自用住宅屋主想確認可能漏掉的權益',scenario:'你要分享自用住宅補貼或相關權益的申請提醒。',a:'自用住宅有很多資訊，今天整理幾個重點。',b:'自用住宅補貼沒注意這件事，可能少領 250 萬！',best:'b',why:'第二句用明確對象、容易忽略的細節和金額差異呈現利益，讀者較容易停下來確認自己是否符合條件。',clues:['明確對象','漏看權益','金額差異'],lesson:'補貼名稱、金額與資格要以最新官方規定為準；「少領 250 萬」只有在特定案例和計算方式成立時才能使用。'},
    {kind:'房地產風險標題',goal:'讓屋主想知道不動產決策的風險',scenario:'你整理一個不動產交易中忽略關鍵資訊而造成損失的案例。',a:'買房賣房要注意很多細節，大家一定要小心。',b:'不動產沒注意這件事，案例損失 2,000 萬：關鍵在這份資料。',best:'b',why:'第二句用案例結果和具體線索建立懸念，讓觀眾想知道是哪份資料、如何避免同類疏漏。',clues:['案例結果','具體線索','避開風險'],lesson:'金額需有可查證的案例和清楚計算方式；房地產資訊應說明地區、交易條件與個別差異。'}

  story:{label:'📖 故事共鳴',questions:[

    {kind:'個人故事',goal:'讓讀者感受到轉變過程',scenario:'你想分享自己第一次拒絕一個不適合的合作。',a:'以前我不太會拒絕別人，後來我慢慢學會照顧自己的感受。',b:'那封合作邀約我看了三天，最後只回了兩句：「謝謝，但這次不適合。」',best:'b',why:'第二句讓讀者看到猶豫、時間和真正說出口的句子，故事正在發生。第一句直接說結論，少了讓人跟著走的過程。',clues:['事件正在發生','具體對話','轉變過程'],lesson:'分享合作故事時，記得保護對方身分與未公開的合作內容。'},
    {kind:'個人故事',goal:'讓讀者想知道你後來怎麼做',scenario:'你分享一次準備很久、卻臨時出錯的經驗。',a:'我曾經遇過一場很挫折的活動，當時真的讓我學到很多。',b:'上台前 10 分鐘簡報打不開，我只好拿起白板筆，從第一張重講。',best:'b',why:'第二句有時間、故障和下一個動作，讀者自然會想知道你怎麼把現場接回來。第一句有情緒，但「很挫折」還沒有具體內容。',clues:['時間壓力','突發事件','留下後續'],lesson:'故事不一定要包裝成完美逆轉，真實說出怎麼處理就很有參考價值。'}

  product:{label:'🛍️ 商品推薦',questions:[

    {kind:'商品推薦',goal:'讓觀眾想知道值不值得買',scenario:'你試用一台價格不低的隨身咖啡機。',a:'這台隨身咖啡機外型很好看，我很喜歡它的設計。',b:'一台 4,000 元的隨身咖啡機，我帶出門一週後最常用的功能是這個。',best:'b',why:'第二句交代價格、實際使用時間，並預告一個具體觀察。觀眾可以評估這則分享和自己的購買考量有沒有關係。',clues:['價格資訊','真實使用','具體發現'],lesson:'分享使用心得時說明測試時間、使用條件與個人偏好，避免把個人感受說成普遍結論。'},
    {kind:'商品推薦',goal:'讓讀者想收藏選購建議',scenario:'你整理三款不同價位的行動電源。',a:'行動電源有很多款，今天整理幾個我覺得不錯的推薦給大家。',b:'買行動電源先看這 2 件事：你每天帶出門的重量，可能比容量更重要。',best:'b',why:'第二句先給選購標準，再用意料之外的比較抓住注意力。讀者知道這篇不是單純列商品，而是會幫他做選擇。',clues:['決策標準','反差觀點','實用價值'],lesson:'規格和安全資訊要以產品標示與可靠資料為準，推薦也要說明適用情境。'}

  family:{label:'👨‍👩‍👧 親子生活',questions:[
    {kind:'親子生活',goal:'讓家長想收藏一個可用的方法',scenario:'你分享一個出門前準備孩子用品的小方法。',a:'帶小孩出門之前，我會先把東西整理好，這樣比較不容易忘記。',b:'帶兩個小孩出門，我把必帶物分成 3 袋，出門前不用再翻整個包包。',best:'b',why:'第二句把方法說得更具體：兩個孩子、三袋、解決翻包包。讀者能快速判斷這個方法是否適合自己，也更容易收藏。',clues:['方法具體','降低麻煩','容易收藏'],lesson:'可以分享自己的做法，但不必暗示每個家庭都適用；把前提說清楚，反而更有參考價值。'},
    {kind:'親子生活',goal:'讓家長想知道孩子的反應',scenario:'你拍一段和孩子一起做簡單點心的過程。',a:'今天和孩子一起做點心，過程很有趣也很開心。',b:'我只準備了 3 種材料，結果孩子把最後一步變成自己的作品。',best:'b',why:'第二句用簡單材料和意料之外的結果，讓人想看孩子究竟做了什麼。第一句告訴讀者「很開心」，但畫面還沒有出現。',clues:['具體材料','意外結果','想看畫面'],lesson:'拍攝孩子前要考量孩子意願與隱私，避免公開可識別的個人資訊。'},
    {kind:'親子生活',goal:'讓照顧者感到被理解',scenario:'你想寫一篇關於帶孩子出門很累的貼文。',a:'帶孩子出門其實很辛苦，很多爸媽都會有同樣的感覺。',b:'到了公園才發現忘記帶水壺，我一邊找便利商店，一邊安慰快哭的孩子。',best:'b',why:'第二句用一個常見但具體的意外，讓照顧者能感覺「這我也遇過」。第一句直接說大家都辛苦，卻還沒有呈現那份辛苦長什麼樣子。',clues:['日常細節','具體情緒','共感場景'],lesson:'描述孩子或家人時注意隱私；共鳴不必靠曝光他們的尷尬時刻。'}

  food:{label:'🍳 美食功能型',questions:[
    {kind:'美食功能型開場',goal:'讓觀眾先想看這道菜',scenario:'你做了一道減脂料理，希望觀眾先被食物吸引。',a:'這道菜很健康，吃了對身體很好，今天教你怎麼做。',b:'這道菜讓我瘦了 5 公斤，減脂期我常常這樣煮。',best:'b',why:'功能型開場先提出明確的結果或使用情境，讓觀眾知道為什麼要看。美食影片的第一秒仍要讓人想吃，健康資訊可以放在後面補充。',clues:['先給觀看理由','功能明確','先讓人想吃'],lesson:'「瘦了 5 公斤」必須是真實、可說明條件的個人經驗，不能暗示一道菜本身保證減重。'},
    {kind:'美食畫面選擇',goal:'用畫面讓人想看完整支食譜',ask:'哪一個畫面更適合放在美食影片的第一秒？',scenario:'你拍氣炸鍋料理，想讓觀眾先被畫面吸引。',a:'先拍自己拿起成品品嚐，對鏡頭說很好吃。',b:'拍攪拌、倒入、翻動，接著接氣炸鍋拉出與成品剖面。',best:'b',why:'攪拌、倒入、翻動和剖面能先呈現食物的質地、變化和成品誘惑。品嚐可以放在後面作為反應，開場先讓觀眾想吃。',clues:['動態畫面','成品質地','先引發食慾'],lesson:'拍攝時優先抓攪拌、倒入、翻動、拉出氣炸鍋與剖面，品嚐反應留到後段。'},
    {kind:'美食功能型開場',goal:'讓忙碌的人覺得方法和自己有關',scenario:'你分享 40 歲後常做的一道簡單料理。',a:'今天來分享一道我最近很喜歡的家常菜。',b:'40 歲後，我都這樣煮不怕胖。',best:'b',why:'第二句讓觀眾快速看見對象和功能，停留理由更明確。健康類利益要由後面的內容交代清楚，不能只靠一句話保證結果。',clues:['明確對象','功能價值','觀看理由'],lesson:'「不怕胖」或「皮帶少一格」等說法只能在有真實依據、適當條件說明時使用，不能暗示單一料理保證減重。'}

  beauty:{label:'💄 美妝／跳操',questions:[
    {kind:'美妝功能型開場',goal:'讓新手想看修容示範',scenario:'你要示範一種讓臉部輪廓更立體的修容方式。',a:'今天來跟大家分享一個我平常很喜歡的修容方法。',b:'新手這樣修容，臉部輪廓看起來更立體：先看我左右臉實測。',best:'b',why:'第二句先說觀眾能看到的變化，再承諾左右臉實測，效果可以直接比較。比起空泛分享喜好，觀眾更清楚留下來能看到什麼。',clues:['效果先行','實測比較','清楚承諾'],lesson:'「臉瞬間變小」等效果型說法要讓畫面真實呈現，不要用濾鏡或角度製造誤導。'},
    {kind:'美妝畫面策略',goal:'讓觀眾相信教學有參考價值',ask:'哪一種拍法更像「替觀眾測試方法」？',scenario:'老師示範鼻影畫法，你想拍一支新手也能看懂的影片。',a:'我對著鏡頭完整畫完妝，最後展示一張完成照。',b:'先呈現老師的具體步驟，再照著畫一次，最後用前後畫面看效果。',best:'b',why:'先把方法說清楚，再由創作者實際照做並展示結果，觀眾能跟著驗證方法是否看得懂、效果是否明顯。觀眾留下來看的，是測試過程和結果。',clues:['跟練形式','替觀眾測試','前後對比'],lesson:'不必假裝每次都成功。保留真實測試過程，效果不明顯時也能說明原因。'},

    {kind:'跳操功能型開場',goal:'讓運動初學者想知道示範能不能做到',scenario:'你準備測試一組腿部動作，希望開場簡短又有目標感。',a:'這樣跳，大腿瘦 2 公分，快跟我一起做。',b:'我用這組動作跟練 7 天，記錄腿部感受和前後變化。',best:'b',why:'A 有明確效果承諾，但若沒有可靠測量，很容易變成誇大保證。B 把焦點放在實際跟練和記錄，觀眾能看到過程並自行判斷。',clues:['先建立紀錄','呈現過程','避免保證效果'],lesson:'減少幾公分必須有可核對的測量方法和條件；不要把單一個案當成所有人都會得到的結果。'}

  workout:{label:'🏃 運動連續紀錄',questions:[

    {kind:'運動系列封面',goal:'讓觀眾一眼看懂進度',ask:'哪個封面更能讓觀眾看懂這是一個持續挑戰？',scenario:'你要發布第 15 天的運動紀錄。',a:'今天運動完成！繼續努力，Day 15。',b:'100 天挑戰 Day 15｜我開始感受到身體的改變',best:'b',why:'第二句同時說明系列、進度和這一集的觀察重點。若要用 Day 1 vs Day 15，最好使用相同穿著、角度和景別，讓比較更可信。',clues:['系列辨識','進度清楚','前後對比'],lesson:'Day 30、50、100 可以回看變化；成果依個人狀況呈現，不要只為了吸睛誇大效果。'}
  ]},
  parenting:{label:'👨‍👩‍👧 親子省錢',questions:[
    {kind:'親子功能型開場',goal:'讓家長停下來確認自己是否能申請',scenario:'你想分享一項家長可能不知道的托育補助。',a:'我孩子好可愛，今天來分享我們家的生活。',b:'這筆托育補助你領了嗎？先確認孩子年齡和所在地條件。',best:'b',why:'家長會優先關心能不能省錢、少走冤枉路，或解決眼前很急的問題。第二句把利益和下一步都說清楚。',clues:['省錢需求','直接提問','明確下一步'],lesson:'補助名稱、金額、資格和地方加碼可能不同且會更新，發布前要查官方最新資訊。'},
    {kind:'親子功能型開場',goal:'讓租屋家長知道可能有哪些資源',scenario:'你想分享生小孩後的租屋補助資訊。',a:'生小孩租屋不用錢，這個福利一定要知道。',b:'生小孩後租屋可能有補助：先看所在地和家庭條件。',best:'b',why:'A 聽起來很有吸引力，但「租屋不用錢」容易讓人誤解成人人都能免費住。B 保留省錢利益，同時說明需要確認適用條件。',clues:['利益清楚','避免誤導','條件說明'],lesson:'租屋補助依年度、地區和個別資格不同；標題不要把「可能有補助」寫成「不用錢」。'},
    {kind:'親子內容畫面',goal:'用低成本素材完成一支生活資訊影片',ask:'哪種呈現方式更適合不想對鏡頭口播的家長？',scenario:'你要分享育兒津貼申請資訊，手邊有孩子的日常片段。',a:'媽媽自己對鏡頭講完整段補助資訊。',b:'用孩子日常片段搭配清楚錄音，畫面再放申請重點與資料來源。',best:'b',why:'生活片段搭配錄音，可以降低拍攝門檻，也讓畫面有生活感。資訊重點和官方來源要清楚呈現，觀眾才方便核對。',clues:['素材再利用','低拍攝門檻','資訊可核對'],lesson:'拍攝孩子要顧及隱私與意願；畫面避免曝光姓名、學校或其他可辨識資料。'},
    {kind:'親子功能型開場',goal:'讓家長覺得內容能解決眼前問題',scenario:'你整理托育補助、育兒津貼與地方加碼的差異。',a:'今天整理一些育兒相關資訊給大家參考。',b:'育兒津貼、托育補助、地方加碼差在哪？先看你家符合哪一種。',best:'b',why:'第二句點出家長會遇到的選擇困難，並承諾幫他分辨適用情況。它比籠統的「育兒資訊」更有立即用途。',clues:['具體問題','分類整理','降低摸索成本'],lesson:'列出資訊更新日期與官方來源；不要只用單一家庭案例推論所有家長都符合。'}
  ]},
  teaching:{label:'📚 專業教學',questions:[
    {kind:'專業教學開場',goal:'讓家長想知道孩子學英文卡在哪',scenario:'你是英文老師，想做一支給家長看的短影音。',a:'今天我在教室裡教英文，帶大家看上課日常。',b:'孩子上課分心，不一定是不認真：先看看他是不是聽不懂這一步。',best:'b',why:'第二句從家長正在困惑的問題開始，再提出一個可理解的觀察方向。第一句只描述老師正在做什麼，陌生觀眾還不知道和自己有什麼關係。',clues:['觀眾的問題','專業觀點','具體方向'],lesson:'若使用「提升 30%」等數字，必須有可靠依據與清楚測量方式；學生個資與影像也要保護。'},
    {kind:'專業教學開場',goal:'讓學習者想看一個具體方法',scenario:'你要教家長一個幫孩子記英文單字的方法。',a:'英文很重要，今天跟大家分享幾個英文學習方法。',b:'孩子背了又忘？先把單字放進一句他每天會用到的話。',best:'b',why:'第二句把常見挫折說得具體，再給一個清楚的小方法。觀眾能立刻知道這篇會處理什麼問題。',clues:['真實困擾','小步驟','能立即嘗試'],lesson:'不要只用「效率提升 30%」吸引注意；若沒有測量資料，就改用可示範的方法描述。'},
    {kind:'專業教學開場',goal:'把日常事件轉成有用內容',scenario:'你是老師，班上有位學生今天上課不專心。',a:'班上有個學生今天很不專心，我來分享一下。',b:'孩子上課分心時，先觀察他卡在哪個步驟，再決定怎麼幫忙。',best:'b',why:'第二句把日常觀察轉成觀眾可以帶走的判斷方法，也保護了學生的個別隱私。',clues:['從日常提煉','可帶走的方法','保護隱私'],lesson:'不要讓學生可被辨認；內容著重一般化的教學觀察，避免公開個案細節。'}
  ]},
  brand:{label:'🏷️ 品牌借勢',questions:[
    {kind:'品牌實測',goal:'讓觀眾想看產品是否適合特定需求',scenario:'你是內衣店老闆娘，想實測一款平價無痕內衣。',a:'最近買了一件新內衣，今天分享穿搭心得。',b:'UNIQLO 無痕內衣適合大胸女生嗎？我用實穿畫面看支撐和舒適度。',best:'b',why:'第二句使用明確品牌和觀眾需求，並說明會實測哪些項目。單純分享新衣服，還沒有交代觀眾為什麼需要看。',clues:['品牌搜尋需求','明確對象','實測標準'],lesson:'品牌名稱只作為實測主題，清楚標示真實使用經驗、合作關係與測試條件。'},
    {kind:'品牌借勢選題',goal:'把商品內容做成可比較的測試',scenario:'你想拍超商熱門飲料的平價復刻與早餐搭配。',a:'今天買了幾款超商飲料，大家一起看看我喜歡哪一個。',b:'只花熱門飲料一半價格，做出手搖店同款？我實際試比例和口感。',best:'b',why:'第二句包含價格差異、明確測試和結果期待，觀眾知道會看到比較過程。借勢提供的是選題入口，內容仍要有自己的實測。',clues:['價格差異','實際測試','借勢後加觀點'],lesson:'不要宣稱「同款」或「一模一樣」除非確實可比較；價格和配方要標明來源與拍攝時間。'},
    {kind:'淘汰型內容',goal:'讓觀眾想檢查自己手邊的用品',scenario:'你想做一支內衣汰換提醒。',a:'今天整理我的內衣櫃，分享最近喜歡的幾件。',b:'內衣出現這 3 個狀況，就該檢查是否需要汰換。',best:'b',why:'第二句提供檢查清單，觀眾能直接對照自己的用品。它比單純展示衣櫃更有明確用途。',clues:['檢查清單','立即可用','清楚數量'],lesson:'說明判斷依據與適用材質，避免把個人偏好包裝成絕對標準。'},
    {kind:'數字差異',goal:'讓觀眾想看一個直觀比較',scenario:'你想示範內衣尺寸與穿著效果的差異。',a:'這件內衣我穿起來很好看，大家覺得如何？',b:'同一件上衣換不同內衣，視覺差異在哪？我用同角度實穿比較。',best:'b',why:'第二句提出可見的比較問題，並用同角度實測增加可判斷性。這比泛泛詢問好不好看更容易吸引有相同困擾的觀眾。',clues:['比較問題','視覺差異','控制拍攝條件'],lesson:'避免使用貶低身形或不實誇大的罩杯差異，清楚說明衣物和拍攝條件。'}
  ]}
};
const categories=Object.entries(questionBank);let selectedCategory='all',questions=[],current=0,score=0,answered=[],streak=0,maxStreak=0;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function renderCategories(){ $('#categories').innerHTML=categories.map(([id,c])=>`<button class="category ${id===selectedCategory?'active':''}" data-category="${id}">${c.label}</button>`).join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>start(b.dataset.category)); }
function start(id=selectedCategory){selectedCategory=id;const pool=questionBank[id].questions;questions=shuffle(pool).slice(0,Math.min(5,pool.length));current=0;score=0;streak=0;maxStreak=0;answered=[];renderCategories();renderQuestion();}
function updateBar(){const max=questions.length*10;$('#level').textContent=`${questionBank[selectedCategory].label}　任務 ${Math.min(current+1,questions.length)} / ${questions.length}`;$('#points').textContent=`⭐ 星星 ${score}`;$('#streak').textContent=`🔥 連勝 ${streak}`;const fill=document.querySelector('#barfill');if(fill)fill.style.width=`${Math.round((current/questions.length)*100)}%`;}
function renderQuestion(){updateBar();const q=questions[current];$('#screen').className='card';$('#screen').innerHTML=`<div class="eyebrow">第 ${current+1} 題 · ${esc(q.kind)}｜目標：${esc(q.goal)}</div><h2>${esc(q.ask||'哪一個開場，更容易讓目標觀眾停下來？')}</h2><p class="sub">先讀情境，再選你認為更適合這個目標的一個。</p><div class="scenario">📝 情境：${esc(q.scenario)}</div><div class="choices"><button class="choice" data-pick="a"><span class="letter">A</span><span class="copy">${esc(q.a)}</span><span class="hint">點一下，選擇這個做法</span></button><button class="choice" data-pick="b"><span class="letter">B</span><span class="copy">${esc(q.b)}</span><span class="hint">點一下，選擇這個做法</span></button></div><div id="feedback"></div><div class="actions"><button class="btn secondary" id="skip">先跳過</button><button class="btn" id="next" disabled>${current===questions.length-1?'看本回合成績':'下一題 →'}</button></div>`;
document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>answer(btn.dataset.pick));$('#skip').onclick=()=>advance(true);$('#next').onclick=()=>current===questions.length-1?renderResult():advance(false);}
function answer(pick){if(answered[current])return;const q=questions[current],correct=pick===q.best;answered[current]=true;if(correct){score+=10;streak++;maxStreak=Math.max(maxStreak,streak)}else{streak=0}document.querySelectorAll('[data-pick]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.pick===q.best);b.classList.toggle('wrong',b.dataset.pick===pick&&!correct);b.classList.toggle('selected',b.dataset.pick===pick)});$('#feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><h3>${correct?'🌟 答對了！觀察力 +10':'🌱 這題先記下一個線索'}</h3><p><b>這題選 ${q.best.toUpperCase()}：</b>${esc(q.why)}</p><p><b>小提醒：</b>${esc(q.lesson)}</p>${q.clues.map(x=>`<span class="clue">${esc(x)}</span>`).join('')}</div>`;$('#points').textContent=`⭐ 星星 ${score}`;$('#streak').textContent=`🔥 連勝 ${streak}`;$('#next').disabled=false;$('#skip').textContent='看解析';}
function advance(skipped){if(skipped&&!answered[current]){answered[current]=false;score=Math.max(0,score)}current++;renderQuestion();}
function renderResult(){updateBar();$('#barfill').style.width='100%';$('#screen').className='card result';const max=questions.length*10,pct=Math.round(score/max*100),right=score/10;let title=pct===100?'觀察力滿點！你很會抓住文案線索。':pct>=60?'很棒，你已經抓到幾個重要線索。':'小島練習完成，文案判斷力會越玩越準。';let feedback=pct===100?'你能辨認具體情境、清楚承諾和觀眾需求。創作時再把這些線索換成自己的真實素材。':pct>=60?'你已經能看到部分開場差異。再留意：觀眾是誰、這句話給了什麼理由讓他繼續看。':'先不用急著追求「神句」。練習把抽象說法換成具體情境，讓觀眾知道內容和自己有什麼關係。';$('#screen').innerHTML=`<div class="eyebrow">🏁 本回合完成</div><h2>${title}</h2><div class="score">${score}<small>本回合分數</small></div><p>${feedback}</p><div class="streak-badge">🏅 最長連勝 ${maxStreak} 題</div><div class="result-grid"><div class="result-tile"><strong>${right} / ${questions.length}</strong><span>答對題數</span></div><div class="result-tile"><strong>${pct}%</strong><span>本回合得分率</span></div><div class="result-tile"><strong>${questionBank[selectedCategory].label}</strong><span>練習類別</span></div></div><div class="note"><b>🌿 冒牌生的小島筆記</b><br>爆款沒有固定公式，只有更符合「內容目標、觀眾情境、真實素材」的選擇。今天的分數是練習回饋，不是你寫文案能力的定論。</div><div class="actions"><button class="btn secondary" id="change">換個主題</button><button class="btn gold" id="again">再玩一回合 ↻</button></div>`;$('#change').onclick=()=>{document.querySelector('#categories').scrollIntoView({behavior:'smooth',block:'center'});};$('#again').onclick=()=>start(selectedCategory);}
renderCategories();start('all');
</script></body></html>
