function start(id=selectedCategory){selectedCategory=id;const pool=questionBank[id].questions;const keyFor=q=>`${q.a}\u241f${q.b}`;let recent=[];try{recent=JSON.parse(localStorage.getItem(`copygame-recent-${id}`)||'[]')}catch{}let fresh=pool.filter(q=>!recent.includes(keyFor(q)));if(fresh.length<Math.min(10,pool.length)){fresh=pool;recent=[]}questions=shuffle(fresh).slice(0,Math.min(10,pool.length));recent=[...recent,...questions.map(keyFor)].slice(-Math.max(10,Math.floor(pool.length*.45)));try{localStorage.setItem(`copygame-recent-${id}`,JSON.stringify(recent))}catch{}current=0;score=0;streak=0;maxStreak=0;answered=[];renderCategories();renderQuestion();} 
function updateBar(){const max=questions.length*10;$('#level').textContent=`${questionBank[selectedCategory].label}　任務 ${Math.min(current+1,questions.length)} / ${questions.length}`;$('#points').textContent=`⭐ 星星 ${score}`;$('#streak').textContent=`🔥 連勝 ${streak}`;const fill=document.querySelector('#barfill');if(fill)fill.style.width=`${Math.round((current/questions.length)*100)}%`;}
function renderQuestion(){updateBar();const q=questions[current];$('#screen').className='card';$('#screen').innerHTML=`<div class="eyebrow">第 ${current+1} 題 · ${esc(q.kind)}｜目標：${esc(q.goal)}</div><h2>${esc(q.ask||'哪一個開場，更容易讓目標觀眾停下來？')}</h2><p class="sub">先讀情境，再選你認為更適合這個目標的一個。</p><div class="scenario">📝 情境：${esc(q.scenario)}</div><div class="choices"><button class="choice" data-pick="a"><span class="letter">A</span><span class="copy">${esc(q.a)}</span><span class="hint">點一下，選擇這個做法</span></button><button class="choice" data-pick="b"><span class="letter">B</span><span class="copy">${esc(q.b)}</span><span class="hint">點一下，選擇這個做法</span></button></div><div id="feedback"></div><div class="actions"><button class="btn secondary" id="skip">先跳過</button><button class="btn" id="next" disabled>${current===questions.length-1?'看本回合成績':'下一題 →'}</button></div>`;
document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>answer(btn.dataset.pick));$('#skip').onclick=()=>advance(true);$('#next').onclick=()=>current===questions.length-1?renderResult():advance(false);}
function answer(pick){if(answered[current]!==undefined)return;const q=questions[current],correct=pick===q.best;answered[current]=correct;if(correct){score+=10;streak++;maxStreak=Math.max(maxStreak,streak)}else{streak=0}document.querySelectorAll('[data-pick]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.pick===q.best);b.classList.toggle('wrong',b.dataset.pick===pick&&!correct);b.classList.toggle('selected',b.dataset.pick===pick)});$('#feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><h3>${correct?'🌟 答對了！觀察力 +10':'🌱 這題先記下一個線索'}</h3><p><b>這題選 ${q.best.toUpperCase()}：</b>${esc(q.why)}</p><p><b>小提醒：</b>${esc(q.lesson)}</p>${q.clues.map(x=>`<span class="clue">${esc(x)}</span>`).join('')}</div>`;$('#points').textContent=`⭐ 星星 ${score}`;$('#streak').textContent=`🔥 連勝 ${streak}`;$('#next').disabled=false;$('#skip').textContent='看解析';}
function advance(skipped){if(skipped&&!answered[current]){answered[current]=false;score=Math.max(0,score)}current++;renderQuestion();}
function renderResult(){updateBar();$('#barfill').style.width='100%';$('#screen').className='card result';const max=questions.length*10,pct=Math.round(score/max*100),right=score/10;let title=pct===100?'觀察力滿點！你很會抓住文案線索。':pct>=60?'很棒，你已經抓到幾個重要線索。':'小島練習完成，文案判斷力會越玩越準。';let feedback=pct===100?'你能辨認具體情境、清楚承諾和觀眾需求。創作時再把這些線索換成自己的真實素材。':pct>=60?'你已經能看到部分開場差異。再留意：觀眾是誰、這句話給了什麼理由讓他繼續看。':'先不用急著追求「神句」。練習把抽象說法換成具體情境，讓觀眾知道內容和自己有什麼關係。';const missed=questions.filter((q,i)=>answered[i]!==true);const clueCount={};missed.forEach(q=>q.clues.forEach(clue=>clueCount[clue]=(clueCount[clue]||0)+1));const weakClue=Object.entries(clueCount).sort((a,b)=>b[1]-a[1])[0]?.[0];const nextStep=missed.length===0?'這回合全數答對！下一步可以試著自己寫兩個版本，確認標題承諾和影片內容一致。':weakClue?`這回合可以優先練「${weakClue}」：下次先把這個線索寫進第一句，再確認畫面或內容真的能證明。`:'下次先說清楚觀眾是誰，再把抽象描述改成一個具體結果或情境。';$('#screen').innerHTML=`<div class="eyebrow">🏁 本回合完成</div><h2>${title}</h2><div class="score">${score}<small>本回合分數</small></div><p>${feedback}</p><div class="streak-badge">🏅 最長連勝 ${maxStreak} 題</div><div class="result-grid"><div class="result-tile"><strong>${right} / ${questions.length}</strong><span>答對題數</span></div><div class="result-tile"><strong>${pct}%</strong><span>本回合得分率</span></div><div class="result-tile"><strong>${questionBank[selectedCategory].label}</strong><span>練習類別</span></div></div><div class="feedback"><h3>📌 你的下一步建議</h3><p>${esc(nextStep)}</p><p>答錯或跳過 ${missed.length} 題；每題解析裡的線索也可以回頭複習。</p></div><div class="note"><b>🌿 好標題和普通標題，差在有沒有把差異講清楚</b><br>普通標題只說「今天分享一道料理／一個運動／一些育兒資訊」；功效型標題會讓觀眾一眼看懂，看完能少什麼、多什麼、避開什麼，或和自己有什麼關係。功效不是亂講，而是把真實差異具體化。<br><br><b>效果好的 5 種下標技巧</b><br>① <b>數據型：</b>用數字說清楚差異，例如「這一碗不到 400 大卡」。數據要有根據。<br>② <b>突顯特色：</b>說出少見、具辨識度的亮點，少用「最強、最新、最棒」等空泛形容。<br>③ <b>第三方認證：</b>引用觀眾認得的族群、名人或機構觀點；交代來源與關係，不假借背書。<br>④ <b>排比句：</b>用相似句型做比較，讓差異更有節奏、更容易看懂。<br>⑤ <b>整合型：</b>把數據、特色、認證、比較或情緒共鳴組合起來；每個元素都要和內容有關。<br><br><b>下標和開場檢查：</b>先回答「看完有什麼差別？」優先講結果，原因和方法留到後面；文字要短、直接、一秒看懂。標題承諾什麼，開場就要接住，內容也要真的證明。版面標題可抓約 21 字上下、每行約 7–8 字，並依手機畫面檢查可讀性。<br><br><b>至少命中 3 種線索：</b>數據、突顯特色、第三方認證（族群／名人／機構）、排比句、整合感。數字、金額、效果、政策和第三方說法都要能查證並交代條件；沒有依據就不要硬塞。<br><br>發布前問自己：觀眾一秒看得懂嗎？知道和自己有什麼關係嗎？標題的承諾，影片能證明嗎？今天的分數是練習回饋，不是你寫文案能力的定論。</div><div class="actions"><button class="btn secondary" id="change">換個主題</button><button class="btn gold" id="again">再玩一回合 ↻</button></div>`;$('#change').onclick=()=>{document.querySelector('#categories').scrollIntoView({behavior:'smooth',block:'center'});};$('#again').onclick=()=>start(selectedCategory);}
renderCategories();start('all');
</script></body></html>
