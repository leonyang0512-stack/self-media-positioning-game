<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6e9"><meta name="description" content="輸入現有 IG 姓名，檢查關鍵字、地區與服務項目，取得修改建議。">
<title>社群姓名健檢｜讓對的人找到你</title>
<style>
:root{--bg:#f5f6e9;--paper:#fffefa;--ink:#35483c;--muted:#6b7e70;--green:#6da787;--line:#dce9d8;--gold:#d6a736;--red:#ae5847;--shadow:0 10px 28px #6d9d7a18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,#ffefd4 0,transparent 24%),radial-gradient(circle at 94% 27%,#ddf2e2 0,transparent 29%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{width:min(100% - 28px,760px);margin:auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-weight:950;font-size:19px;color:#476d5a}.top a{color:#587c60;text-decoration:none;font-size:14px;font-weight:800}.hero{padding:23px clamp(20px,5vw,36px);border:2px solid #fff8e6;border-radius:22px;background:linear-gradient(130deg,#e7f3df,#fff5d8 68%,#f8e5cf);box-shadow:0 9px 22px #658f7118}.eyebrow{display:inline-block;padding:4px 10px;border-radius:99px;background:#fffefa;color:#62846a;font-size:12px;font-weight:900}.hero h1{margin:9px 0 4px;font-size:clamp(27px,5vw,38px);line-height:1.2}.hero p{margin:0;color:#52675a;font-size:14px}.progress{display:flex;align-items:center;gap:9px;margin:14px 0 0;color:var(--muted);font-size:13px;font-weight:800}.progress .active{color:#477c52}.progress .line{height:1px;width:36px;background:#cdd9ca}.panel{margin-top:13px;padding:clamp(17px,4vw,24px);border:2px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}.panel h2{margin:0 0 4px;font-size:20px}.desc{margin:0 0 13px;color:var(--muted);font-size:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:14px;font-weight:850}.field input{width:100%;padding:11px 12px;border:1.5px solid #d8e5d5;border-radius:11px;background:white;color:var(--ink);font:inherit}.field input:focus{outline:2px solid #77aa8555;border-color:#77aa85}.field small{font-size:11px;color:var(--muted)}.btn{display:inline-flex;justify-content:center;align-items:center;margin-top:13px;padding:11px 17px;border:0;border-radius:11px;background:var(--green);color:white;font:inherit;font-weight:900;box-shadow:0 4px 0 #487e61;cursor:pointer}.btn:hover{filter:brightness(1.04)}.btn.secondary{background:#eef3e9;color:#496451;box-shadow:0 3px 0 #d8e2d2}.page[hidden]{display:none}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.score{display:grid;justify-items:center;min-width:92px;padding:8px 10px;border-radius:13px;background:#fff7e3}.stars{color:var(--gold);font-size:20px;letter-spacing:1px;white-space:nowrap}.score small{font-size:11px;color:var(--muted);font-weight:800}.reviewed-name{margin:9px 0 13px;padding:12px 14px;border-radius:12px;background:#f3f6e9;font-size:17px;font-weight:900;overflow-wrap:anywhere}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.analysis-card{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.analysis-card h3{margin:0 0 7px;font-size:15px}.analysis-card ul{margin:0;padding-left:19px}.analysis-card li{margin:5px 0;font-size:13px}.suggestion{margin-top:10px;padding:13px;border-radius:13px;background:#f3f6e9}.suggestion h3{margin:0 0 6px;font-size:15px}.suggestion-list{margin:0;padding-left:27px;display:grid;gap:7px}.suggestion-list li{padding:8px 10px;border-radius:9px;background:#fff;font-weight:850;font-size:15px;overflow-wrap:anywhere}.suggestion p{margin:7px 0 0;color:var(--muted);font-size:12px}.footnote{margin:9px 0 0;color:var(--muted);font-size:11px}@media(max-width:560px){.wrap{width:min(100% - 20px,760px);padding-top:10px}.top{align-items:flex-start}.brand{font-size:17px}.form-grid,.analysis-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.result-head{align-items:flex-start}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand">🌱 社群姓名健檢</div><a href="../">← 回到前三秒留人大挑戰</a></header>
<section class="hero"><span class="eyebrow">簡單兩步，找到名字的問題</span><h1>讓對的人，更容易找到你</h1><p>先輸入現有 IG 姓名和關鍵資料，下一頁直接看優點、問題與修改建議。</p><div class="progress"><span id="stepOne" class="active">1　輸入資料</span><i class="line"></i><span id="stepTwo">2　姓名分析</span></div></section>
<section class="panel page" id="inputPage"><h2>輸入你的 IG 姓名資料</h2><p class="desc">填你目前的名稱和想呈現的資訊，系統會幫你檢查怎麼排列更清楚。</p><div class="form-grid">
<div class="field full"><label for="currentName">現有 IG 姓名</label><input id="currentName" maxlength="70" placeholder="例如：把藝伎當水喝的 Amy｜選豆｜現烘｜手沖教學"></div>
<div class="field"><label for="nickname">暱稱</label><input id="nickname" maxlength="24" placeholder="例如：Amy、小花、思好"></div>
<div class="field"><label for="keywords">主題關鍵字</label><input id="keywords" maxlength="40" placeholder="例如：咖啡師、親子教養"></div>
<div class="field"><label for="location">地區（選填）</label><input id="location" maxlength="20" placeholder="例如：淡水、台中、東京"></div>
<div class="field"><label for="services">服務項目／內容特色</label><input id="services" maxlength="60" placeholder="例如：手沖教學、咖啡豆玩家"></div>
</div><button class="btn" id="analyze">看名字好不好 →</button></section>
<section class="panel page" id="resultPage" hidden><div class="result-head"><div><span class="eyebrow">你的姓名分析</span><h2 id="resultTitle">看完了，來調整名字</h2></div><div class="score"><span id="stars" class="stars"></span><small id="scoreText"></small></div></div><div class="reviewed-name" id="reviewedName"></div><div class="analysis-grid"><article class="analysis-card"><h3>✅ 哪裡好</h3><ul id="good"></ul></article><article class="analysis-card"><h3>🔧 哪裡不好／可加強</h3><ul id="issues"></ul></article></div><div class="suggestion"><h3>✍️ 五個修改建議</h3><ol class="suggestion-list" id="suggestions"></ol><p id="suggestionReason"></p></div><p class="footnote">建議依照你的真實專業、服務和內容調整；姓名關鍵字不代表平台搜尋排序保證。</p><button class="btn secondary" id="back">← 回去修改資料</button></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vague=['化妝','美妝','美食','食譜','親子','咖啡','健康分享','健康','旅遊分享','旅遊','生活分享','生活','日常分享','日常','款式分享','凍齡','逆齡','美魔女','北部','中部','南部','高屏','北北基'];
const hardSell=['斜槓創業','無痛開店','理財現金流','存錢現金流','帶你飛','幫你賺錢','抽獎','微商','直銷'];
const searchWords=['手沖教學','咖啡豆','咖啡師','孕期','育兒補助','育兒津貼','低卡甜點','微波廚房','探店','平價小吃','咖啡廳','懶人烘焙','減脂料理','親子教養','親子餐廳','自由行','行程規劃','化妝教學','暈染美甲','手繪美甲','凝膠美甲','美髮師','染髮','居家跳操','報稅','勞保勞退','7-ELEVEN','711','全家','全聯','好市多'];
const localWords=['美食','探店','旅遊','自由行','住宿','民宿','美髮','美甲','美睫','咖啡廳','餐廳','在地服務'];
function tokens(s){return s.split(/[｜|・×／/，,；;、]+/).map(x=>x.trim()).filter(Boolean)}
function analyze(){const name=$('#currentName').value.trim(),nick=$('#nickname').value.trim(),keyword=$('#keywords').value.trim(),city=$('#location').value.trim(),service=$('#services').value.trim();if(!name||!nick||!keyword){alert('請先填寫現有 IG 姓名、暱稱和主題關鍵字。');return}const parts=tokens(name),first=parts[0]||name,keyTokens=tokens(keyword),serviceTokens=tokens(service),provided=[...serviceTokens,...keyTokens],specificProvided=provided.filter(x=>x&&!vague.includes(x)&&!provided.some(y=>y!==x&&y.includes(x))),all=`${name} ${keyword} ${service}`,weak=[...new Set(vague.filter(w=>all.includes(w)&&!specificProvided.some(x=>x.includes(w))))],sales=hardSell.filter(w=>all.includes(w)),knownSearch=searchWords.filter(w=>all.toLowerCase().includes(w.toLowerCase())),nickFirst=name.trim().startsWith(nick),business=/^(?:公司|品牌|工作室|企業|官方帳號|[\u4e00-\u9fffA-Za-z0-9·&（）()]+(?:工作室|有限公司|企業))/.test(first),gimmick=/^(?:把.+(?:當|拿).+|.+愛(?:化妝|旅遊|美食))/.test(first),hasCity=city&&name.includes(city),localNeed=localWords.some(w=>keyword.includes(w)||service.includes(w)),scoreReasons=[],good=[],issues=[];let score=5;
if(nickFirst&&!business&&!gimmick)good.push(`暱稱「${nick}」有放在前面，陌生人能先認識你。`);else if(!name.includes(nick)){issues.push(`現有名稱沒有清楚放入暱稱「${nick}」，建議把暱稱放到最前面。`);score-=1}else if(business||gimmick){issues.push(business?'公司、品牌或工作室搶在個人前面，建議改成暱稱或身份開頭。':'開頭比較像玩梗或口號，陌生人不容易先知道你是誰；把暱稱或職業移到前面。');score-=1}
const matched=specificProvided.filter(x=>name.includes(x));if(matched.length)good.push(`名稱有呈現你提供的關鍵字：「${[...new Set(matched)].slice(0,3).join('、')}」。`);else{issues.push('你填的主題關鍵字或服務項目沒有出現在姓名裡，觀眾可能看不出你實際分享什麼。');score-=1}
if(weak.length){issues.push(`「${[...new Set(weak)].join('、')}」太籠統或搜尋意圖不明，換成具體的服務、品項或內容題目。`);score-=Math.min(1.5,[...new Set(weak)].length*.5)}
if(sales.length){issues.push(`「${[...new Set(sales)].join('、')}」商業感偏重，粉絲還少時陌生人可能先有戒心；試著改成自然、像真人會說的詞。`);score-=1}
if(parts.length>4){issues.push(`姓名拆成 ${parts.length} 段，資訊有點滿。留一個主題，再挑一到兩個重要搜尋詞就好。`);score-=1}else if(parts.length<=3)good.push('資訊量精簡，沒有把太多主題擠進姓名欄。');
const repeated=parts.some((a,i)=>parts.slice(i+1).some(b=>a.length>1&&b.length>1&&(a.includes(b)||b.includes(a))));if(repeated){issues.push('不同片段有重複關鍵字，留下較具體、最常被搜尋的一個即可。');score-=.5}
if(localNeed&&city){if(hasCity)good.push(`有放入地區「${city}」，對在地服務或旅行探店類內容有幫助。`);else issues.push(`你填了地區「${city}」，但姓名裡沒有出現。若觀眾會搜尋所在地，可考慮加上。`)}else if(city&&!localNeed)issues.push(`「${city}」不一定對「${keyword}」加分；親子教養等主題通常不必硬放地區，除非是當地景點或服務。`);else if(localNeed&&!city)issues.push('這類主題通常有地區搜尋需求，可以評估加上城市名；不需要寫大範圍地區或國家名。');
if((keyword.includes('超商')||service.includes('超商'))&&!/7-ELEVEN|7-Eleven|711|7-11|全家|全聯|好市多/i.test(name))issues.push('超商內容建議用店家品牌名稱，例如 7-ELEVEN、全家、全聯或好市多，比「超商」具體。');
if(knownSearch.length&&good.length===0)good.push(`已有具體關鍵字，例如「${knownSearch.slice(0,3).join('、')}」。`);if(!good.length)good.push('暱稱、主題和服務資料已填齊，接下來把最重要的詞放進姓名，讓定位更明確。');if(!issues.length)issues.push('目前沒有明顯問題。確認每個詞都跟你的內容有關，而且專業與服務資訊真實。');score=Math.max(1,Math.min(5,Math.round(score)));
let identity=nick;if(gimmick){identity=first.replace(/^把.*?當.*?喝的?\s*/,'').replace(/^(.+?)愛(?:化妝|旅遊|美食).*$/,'$1').trim()||nick}const role=keyTokens.find(x=>/(師|老師|護理師|咖啡師)$/.test(x));const head=role?`${role} ${identity}`:identity;const terms=[...new Set(specificProvided.filter(x=>x!==role))];const primary=serviceTokens.find(x=>terms.includes(x))||terms[0]||keyword;const related=terms.filter(x=>x!==primary);const branchSets=[[/化妝|美妝/,['新手化妝教學','底妝教學','眼妝教學','日常妝容教學']],[/咖啡/,['手沖咖啡教學','咖啡豆挑選','咖啡器具教學']],[/親子|育兒|孕期/,['孕期資訊','育兒補助','育兒津貼','親子教養']],[/食譜|料理|甜點|烘焙/,['低卡甜點','減脂料理','微波料理','懶人烘焙']],[/美甲/,['暈染美甲','手繪美甲','凝膠美甲']],[/美髮/,['染髮','短髮整理','頭皮護理']],[/旅遊|旅行|自由行/,['東京自由行','大阪住宿','行程規劃']],[/美食|探店/,['平價小吃','咖啡廳探店','在地美食']],[/運動|跳操|健身/,['居家跳操','徒手訓練','新手跟練']],[/理財|保險|報稅/,['報稅整理','勞保勞退','家庭理財']],[/超商|便利商店/,['7-ELEVEN 開箱','全家新品','全聯好物']],[/心理測驗/,['性格測驗','心理測驗','職涯測驗']],[/穿搭|時尚/,['小資穿搭','通勤穿搭','身形穿搭']]];const branch=(branchSets.find(([re])=>re.test(`${keyword} ${service}`))||[])[1]||[];const options=[];if(/教學$/.test(primary))options.push(`${identity}的${primary}`);options.push(`${head}｜${primary}`);if(related[0])options.push(`${head}｜${related[0]}`);if(related[0])options.push(`${head}｜${primary}｜${related[0]}`);for(const item of branch)options.push(`${head}｜${item}`);if(localNeed&&city)options.push(`${head}｜${city}｜${primary}`);const suggestions=[...new Set(options)].slice(0,5);const fill=['你的服務對象','你的特色項目','具體內容主題'];for(const item of fill){if(suggestions.length>=5)break;suggestions.push(`${head}｜${primary}｜${item}`)}$('#reviewedName').textContent=name;$('#stars').textContent='★'.repeat(score)+'☆'.repeat(5-score);$('#scoreText').textContent=`清晰度 ${score}／5`;$('#good').innerHTML=good.map(x=>`<li>${esc(x)}</li>`).join('');$('#issues').innerHTML=issues.map(x=>`<li>${esc(x)}</li>`).join('');$('#suggestions').innerHTML=suggestions.map(x=>`<li>${esc(x)}</li>`).join('');$('#suggestionReason').textContent='前幾個提案依照你填的暱稱、關鍵字和服務組合；細分項目請只選你確實有提供的內容。每個名字都只保留一次相同關鍵字。';$('#inputPage').hidden=true;$('#resultPage').hidden=false;$('#stepOne').classList.remove('active');$('#stepTwo').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
$('#analyze').onclick=analyze;$('#back').onclick=()=>{$('#resultPage').hidden=true;$('#inputPage').hidden=false;$('#stepTwo').classList.remove('active');$('#stepOne').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
