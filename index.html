<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冒牌生｜自媒體定位探索遊戲</title><style>
:root{--bg:#f5f5f2;--ink:#19212b;--muted:#697583;--blue:#33b5c9;--purple:#6758c8;--line:#dce3e7;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:920px;margin:auto;padding:24px 18px 65px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.5px}.small{font-size:13px;color:var(--muted)}.hero{background:linear-gradient(125deg,#2cb2c7,#5179d5);color:white;padding:36px 30px;border-radius:26px;box-shadow:0 15px 40px #2464a122}.hero h1{font-size:clamp(29px,5vw,46px);line-height:1.2;margin:8px 0 14px}.hero p{margin:0;max-width:650px}.pill{display:inline-block;background:#ffffff2b;border:1px solid #ffffff55;padding:4px 12px;border-radius:50px;font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:20px;box-shadow:0 6px 22px #23394a09}.step{display:flex;gap:8px;margin:22px 0 0}.dot{height:7px;border-radius:8px;background:#dce1e7;flex:1}.dot.on{background:var(--blue)}h2{font-size:25px;line-height:1.35;margin:0 0 8px}h3{font-size:18px;margin:0 0 9px}.sub{color:var(--muted);margin:0 0 22px}.field{margin:22px 0}.field>label{font-weight:800;display:block;margin-bottom:10px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{border:1.5px solid #d9e1e6;background:white;border-radius:13px;padding:13px 14px;text-align:left;transition:.15s;min-height:54px}.opt:hover{border-color:#52adc2}.opt.selected{border-color:#2c9fb7;background:#e8f8fb;color:#11586c;font-weight:800}.full{width:100%;border:1px solid #cfdbe0;border-radius:12px;padding:13px;background:white}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.btn{border:0;border-radius:12px;background:var(--purple);color:white;font-weight:800;padding:12px 22px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#edf0f5;color:#273447}.notice{border-radius:15px;background:#f0f8fb;padding:15px 18px;border-left:4px solid var(--blue);margin:16px 0}.result{border:1px solid #dce4eb;border-radius:17px;padding:19px;margin:14px 0}.result .tag{font-size:12px;font-weight:800;color:#287f91;letter-spacing:.5px}.result h3{margin:5px 0 7px}.hook{font-size:19px;font-weight:900;line-height:1.5;margin:12px 0;color:#273e82}.muted{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{border-radius:50px;background:#edf4f8;padding:5px 10px;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#f7f8fa;border-radius:12px;padding:13px}.mini strong{display:block}.cost{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.cost span{background:#f2f4f8;border-radius:8px;padding:4px 9px;font-size:12px}.bar{height:9px;border-radius:8px;background:#e6eaf0;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:#34b2c5}.footer{margin-top:25px;color:#6b7782;font-size:12px;text-align:center}.hidden{display:none!important}@media(max-width:620px){.wrap{padding:12px 12px 40px}.hero{padding:28px 20px}.card{padding:19px}.options,.two{grid-template-columns:1fr}.nav .btn{flex:1}.hook{font-size:17px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">🎮 冒牌生｜定位探索研究所</div><span class="small">互動教學版 · 約 4 分鐘</span></div><section class="hero"><span class="pill">創作者新手村</span><h1>你不缺題材。<br>你可能只是還沒找到觀眾想看的角度。</h1><p>先了解你的身分、經營目標和現實條件，再探索適合測試的內容玩法。這裡沒有把你判定成某一種人的標準答案。</p></section><div class="step" id="progress"></div><section class="card" id="screen"></section><div class="footer">本工具是內容策略練習，不保證流量或收入。醫療、金融、稅務及產品功效內容請先查證並遵守相關規範。</div></main><script>
const state={step:0,roles:[],goals:[],business:'',interests:[],hours:'',budget:'',face:'',outside:'',worry:'',preferred:'',compare:''};
const roles=[['home','家庭主婦／照顧者'],['pro','醫師／會計師／記帳士等專業人士'],['insurance','保險／金融業務'],['beauty','美業／按摩／醫美／婚禮服務'],['seller','微商／直銷／團購'],['creator','自媒體／AI／行銷／課程工作者'],['teacher','學校老師／家教'],['pet','寵物飼主'],['office','一般上班族'],['other','其他／還沒有明確方向']];
const goals=[['fans','先增加粉絲和曝光'],['goods','銷售產品／保健品／團購'],['service','銷售保險／專業服務／顧問'],['course','銷售課程／知識／數位商品'],['team','招募成員／建立團隊']];
const interests=[['cook','煮飯／做甜點'],['exercise','在家運動／跳操'],['shop','逛超商／全聯／比價'],['quiz','心理測驗／互動遊戲'],['teach','教學／解決問題'],['beauty','保養／美妝／美甲'],['pet','照顧寵物'],['travel','探店／旅遊'],['fashion','穿搭'],['money','理財／省錢']];
const byId=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=id=>state.roles.includes(id), likes=id=>state.interests.includes(id);
function opt(id,label,field,multi=false){const selected=multi?state[field].includes(id):state[field]===id;return `<button type="button" class="opt ${selected?'selected':''}" data-field="${field}" data-value="${esc(id)}" data-multi="${multi}">${selected?'✓ ':'○ '}${esc(label)}</button>`}
function group(title,arr,field,multi=false,note=''){return `<div class="field"><label>${title}</label>${note?`<div class="small" style="margin:-7px 0 12px">${note}</div>`:''}<div class="options">${arr.map(x=>opt(x[0],x[1],field,multi)).join('')}</div></div>`}
function nav(back=true,next='下一關 →'){return `<div class="nav">${back?'<button class="btn secondary" id="back">← 上一步</button>':'<span></span>'}<button class="btn" id="next">${next}</button></div>`}
function setStep(n){state.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){byId('progress').innerHTML=Array.from({length:5},(_,i)=>`<div class="dot ${i<=state.step?'on':''}"></div>`).join('');let html='';
if(state.step===0){html=`<h2>第一關｜你有哪些身分？</h2><p class="sub">可以複選。家庭主婦也可能同時是保險業務、微商或創作者。</p>${group('① 你現在有哪些身分？',roles,'roles',true,'選擇所有符合你的選項')}${group('② 你經營自媒體想達成哪些目標？',goals,'goals',true,'可以複選。增粉後也能賣產品、課程、服務或招募成員，不需要只選一條路。')}${nav(false)}`}
if(state.step===1){html=`<h2>第二關｜你有什麼可以運用？</h2><p class="sub">不需要是專家。你平常願意做的事情，也可以成為內容素材。</p>${group('③ 平常願意做或有機會接觸的事',interests,'interests',true,'可複選；選不出來也可以繼續')}${group('④ 你最擔心哪件事？',[['none','覺得自己沒有才能'],['camera','害怕拍不好／不敢露臉'],['views','擔心沒人看'],['time','沒有時間或預算'],['choice','不知道該選什麼方向']],'worry')}${nav()}`}
if(state.step===2){html=`<h2>第三關｜現實條件檢查</h2><p class="sub">你有沒有信心，不會決定你的定位；但時間、金錢與拍攝條件，會影響你能否持續做。</p>${group('⑤ 每週可投入的時間',[['low','2 小時以內'],['mid','3～5 小時'],['high','6 小時以上']],'hours')}${group('⑥ 每月願意投入的拍攝費用',[['low','0～500 元'],['mid','500～2,000 元'],['high','2,000 元以上']],'budget')}${group('⑦ 願意露臉嗎？',[['no','暫時不想'],['yes','願意'],['maybe','都可以']],'face')}${group('⑧ 能否固定外出拍攝？',[['no','不方便／不想'],['yes','可以'],['sometimes','偶爾可以']],'outside')}${nav()}`}
if(state.step===3){html=`<h2>第四關｜你想挑戰哪種內容？</h2><p class="sub">先選自己想做的，再看看不同形式的成本和替代方案。這裡不會禁止你選擇。</p>${group('⑨ 你最想做哪種內容？',[['auto','我還不知道，請幫我探索'],['food','食譜／甜點'],['compare','價格、收入或結果落差'],['quiz','心理測驗／互動選擇題'],['exercise','居家跳操'],['store','餐廳／親子景點探店'],['market','超商／全聯商品開箱'],['fashion','穿搭'],['daily','生活／工作／孩子／寵物日常'],['teach','職場專業知識']],'preferred')}${state.preferred==='store'||state.preferred==='fashion'?`<div class="notice"><b>喜歡就可以試，但先看成本：</b> ${state.preferred==='store'?'餐廳或親子景點探店通常涉及交通、消費、找店、企劃及現場拍攝；可以先試超商飲料或全聯商品比較。':'穿搭通常需要持續準備服裝、造型、場景，可能有較高的購買成本；也可以先試一件單品三種搭法、衣櫃現有衣物比較。'}</div>`:''}${state.preferred==='daily'?'<div class="notice"><b>日常也可以拍，但陌生觀眾需要觀看理由。</b> 把「今天的工作／小孩／寵物」改成能幫觀眾省錢、省時、解決問題或滿足好奇心的內容；並注意客戶、學生與孩子的隱私。</div>':''}${nav(true,'產生我的定位探索報告 ✨')}`}
if(state.step===4){html=report()}
byId('screen').innerHTML=html;byId('screen').querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{let f=b.dataset.field,v=b.dataset.value;if(b.dataset.multi==='true'){state[f]=state[f].includes(v)?state[f].filter(x=>x!==v):[...state[f],v]}else state[f]=v;render()});const back=byId('back'),next=byId('next');if(back)back.onclick=()=>setStep(state.step-1);if(next)next.onclick=()=>{if(state.step===0&&(!state.roles.length||!state.goals.length)){alert('請先選擇至少一個身分與一個經營目標');return}if(state.step===2&&(!state.hours||!state.budget||!state.face||!state.outside)){alert('請先完成時間、預算與拍攝條件');return}if(state.step===3&&!state.preferred){alert('請先選擇想探索的內容');return}setStep(state.step+1)};const restart=byId('restart');if(restart)restart.onclick=()=>setStep(0);const copy=byId('copy');if(copy)copy.onclick=()=>{let text=byId('summary').innerText;navigator.clipboard?.writeText(text).then(()=>alert('已複製探索報告')).catch(()=>alert('請長按選取文字複製'))};const swap=byId('swap');if(swap)swap.onclick=()=>{state.preferred='auto';render()};}
const catalog={
compare:{title:'價格／條件／結果落差',cost:'低～中',time:'低～中',batch:'可固定場景批量拍攝',why:'從觀眾關心的金錢、結果與差異切入，比單純介紹職業更容易建立觀看理由。'},
food:{title:'食譜／成果反差',cost:'低～中',time:'低～中',batch:'同一次備餐可拍多支',why:'熟悉的廚房、可控的食材成本，適合從省時、省錢與具體成果設計內容。'},
quiz:{title:'心理測驗／互動選擇題',cost:'低',time:'低',batch:'圖文與短片容易系列化',why:'用觀眾願意參與的選擇題切入，能跨領域連結花藝、音樂、感情或生活。'},
exercise:{title:'居家跳操／簡單運動',cost:'低',time:'低～中',batch:'固定場景、動作可系列化',why:'在家拍攝、設備需求較少，適合願意示範動作的人。'},
market:{title:'超商／全聯精選與比較',cost:'低～中',time:'低～中',batch:'一次採買可拍多支',why:'購買方便、價格可控，較容易從一項商品延伸出多個比較題目。'},
store:{title:'餐廳／親子景點探店',cost:'中～高',time:'高',batch:'通常需要逐店安排',why:'能累積實地體驗，但需要交通、消費、場地配合與較完整的企劃。'},
fashion:{title:'穿搭／單品比較',cost:'中～高',time:'中～高',batch:'可集中搭配拍攝',why:'需要服裝與造型素材，若頻繁購新衣，長期成本可能偏高。'},
daily:{title:'日常轉化成實用內容',cost:'低～中',time:'低～中',batch:'視生活情境而定',why:'把自己的生活變成觀眾能學到的做法，避免只記錄對陌生人缺乏意義的流水帳。'},
teach:{title:'專業知識生活化',cost:'低',time:'中',batch:'可固定場景拍攝',why:'保留專業優勢，但用一般人關心的問題、數字和結果差異切入。'}};
function topicSet(){let p=state.preferred;let rank=[];function add(k){if(!rank.includes(k))rank.push(k)}if(p&&p!=='auto')add(p);if(has('insurance')||has('pro')||likes('money')||state.goals.includes('service'))add('compare');if(has('teacher')||has('creator')||state.goals.includes('course'))add('teach');if(likes('cook')||has('home'))add('food');if(likes('exercise'))add('exercise');if(likes('quiz')||has('beauty')||has('seller'))add('quiz');if(likes('shop')||has('seller')||state.goals.includes('goods'))add('market');if(has('pet'))add('market');if(likes('travel'))add('store');if(likes('fashion'))add('fashion');if(likes('teach'))add('teach');['compare','quiz','market','food','exercise','teach'].forEach(add);return rank.slice(0,3)}
function hooks(k){const pro=has('insurance')||has('pro'), pet=has('pet')||likes('pet'), beauty=has('beauty')||likes('beauty'), teacher=has('teacher'), creator=has('creator'), cook=likes('cook')||has('home'), money=likes('money'), seller=has('seller')||state.goals.includes('goods');
if(k==='compare'){if(pro)return ['我媽媽繳了 30 年勞保，為什麼退休後可能比別人少領 30 萬？','同樣年收入 100 萬，為什麼兩個人的所得稅差這麼多？','同樣留下 2,000 萬元，為什麼兩個家庭的遺產稅可能不同？'];if(creator)return ['同樣經營 IG 3 個月，為什麼有人增加 1 萬粉絲，有人只增加 100 人？','同樣剪一支影片，為什麼有人花 20 分鐘，有人花 3 小時？','花 0 元和花 3,000 元做自媒體，成果差在哪？'];if(pet)return ['同樣花 300 元，這 3 款狗零食哪一款最划算？','兩款貓砂價格差了 200 元，使用成本差在哪？','同樣養一隻狗，這 3 種日常用品一個月差多少錢？'];if(beauty)return ['同樣做一次美甲，為什麼價格差了 2,000 元？','500 元和 3,000 元的保養服務，差別到底在哪？','同樣是婚禮主持，為什麼報價可能差 1 萬元？'];if(teacher)return ['同樣學英文 3 個月，自學和家教的時間成本差多少？','同樣花 1,000 元買教材，哪一種比較適合初學者？','每天背 10 個單字，30 天後能記住多少？'];return ['同樣花 100 元，全聯和超商能買到多少東西？','一杯 30 元和 90 元的飲料，差別到底在哪？','同樣一餐 150 元，自己煮和外食的成本差多少？']}
if(k==='food')return ['這道菜陪我瘦了 5 公斤，做法只要 3 步驟','減脂時還能吃甜點？我分享自己瘦了 5 公斤時的飲食安排','只花 100 元，我做出 3 道可以帶便當的料理'];
if(k==='quiz'){if(beauty)return ['選 1 種花色，看看你偏好的戀愛氛圍','3 種美甲款式選 1 個，你最在意哪種風格？','選 1 束花，看看你想傳達的心意'];if(teacher)return ['選 1 個英文字母，看看你偏好的學習方式','3 句英文選 1 句，你最常用哪種表達方式？','選 1 首歌，看看你喜歡哪一種音樂風格'];return ['3 杯飲料選 1 杯，看看你偏好的生活節奏','選 1 扇門，看看你最近最在意什麼','3 個選項選 1 個，你會先存錢、旅行還是買禮物？']}
if(k==='exercise')return ['每天跳 10 分鐘，我連續做 30 天有什麼變化？','不去健身房，這 5 個居家動作你能完成幾個？','每天 3 個動作，久坐上班族跟著練 10 分鐘'];
if(k==='market'){if(pet)return ['同樣花 300 元，3 款寵物零食實際份量差多少？','買貓砂前先看！這 3 種材質差在哪？','我花 500 元測試 3 款寵物用品，哪款最值得留？'];if(seller)return ['全聯 100 元內，這 3 樣東西哪個最值得買？','7-Eleven 3 款飲料，糖分和價格差多少？','同樣是 299 元，這 2 款保養品的成分標示差在哪？'];return ['7-Eleven 3 款飲料，哪一杯最值得買？','全聯 100 元內，這 3 樣商品哪個最實用？','我花 150 元實測 3 款超商早餐，哪個最有飽足感？']}
if(k==='store')return ['一家 4 口花 1,000 元，這家餐廳到底值不值得？','同樣 500 元，這 2 家早餐店差在哪？','帶小孩出門花 300 元，這個景點能玩多久？'];
if(k==='fashion')return ['只用 1 件白襯衫，搭出 3 套上班穿搭','花 0 元重新搭配衣櫃，這 5 套哪套最顯精神？','同樣 1,000 元，這 2 件外套哪件比較實穿？'];
if(k==='daily')return ['每天只花 10 分鐘，我怎麼整理家裡最亂的角落？','同樣照顧 1 隻狗，這 3 個用品怎麼選？','上班前只有 15 分鐘，我怎麼完成今天的便當？'];
if(creator)return ['一支影片剪 3 小時？這 3 個步驟讓我減少重複工作','同樣經營 30 天，為什麼這 2 種開場差這麼多？','新手最容易忽略的 3 個影片開場問題'];if(pro)return ['少買一個保險就虧 30 萬？先看保障缺口怎麼計算','同樣繳 30 年勞保，為什麼退休給付可能不同？','報稅前先看：這 3 種扣除額有什麼差別？'];return ['第一次做這件事，先避開 3 個常見錯誤','同樣花 30 分鐘，這 2 種方法哪個比較省時間？','只用 3 個步驟，完成一件原本很麻煩的事']}
function warnings(k){let arr=[];if(k==='food')arr.push('「瘦 5 公斤」必須是可證實的個人經驗，並說明整體飲食與生活條件；不可暗示單靠一道菜就能減重。');if(k==='exercise')arr.push('運動成果因人而異，避免保證瘦身或使用未經證實的健康宣稱。');if(k==='quiz')arr.push('心理測驗可作娛樂互動，不要宣稱能科學診斷人格、心理狀態或命運。');if(has('insurance')||has('pro')||likes('money'))arr.push('保險、稅務、勞保、理財等數字需依真實條件與最新規範查證；案例不能虛構成親身經歷。');if(has('creator')||state.goals.includes('course'))arr.push('流量與收入比較要有可核實的數據，不要暗示學員一定能複製相同成果。');if(has('seller')||state.goals.includes('goods'))arr.push('保健品、飲料、保養品不可宣稱未證實的治療、排便或減重功效；避免誇大廣告。');if(has('teacher')||has('insurance')||has('beauty')||state.preferred==='daily')arr.push('拍攝前確認公司、學校、客戶與兒童隱私；不要曝光可識別個資或未授權畫面。');if(k==='store')arr.push('探店需留意場地規範、他人入鏡、交通與消費成本。');if(k==='fashion')arr.push('先使用現有衣物測試，避免為了內容持續購買新服裝。');return [...new Set(arr)].slice(0,4)}
function report(){let keys=topicSet(), hrs=state.hours==='low'?'每週 2 小時內':state.hours==='mid'?'每週 3～5 小時':'每週 6 小時以上', budget=state.budget==='low'?'每月 0～500 元':state.budget==='mid'?'每月 500～2,000 元':'每月 2,000 元以上';let risk=state.preferred==='store'||state.preferred==='fashion';let label=roles.filter(x=>state.roles.includes(x[0])).map(x=>x[1]).join('、');let goalLabel=goals.filter(x=>state.goals.includes(x[0])).map(x=>x[1]).join('、');let head=`<h2>🎉 你的定位探索報告</h2><p class="sub">這是值得優先測試的方向，不是替你決定一輩子的定位。</p><div class="chips"><span class="chip">${esc(label)}</span><span class="chip">🎯 ${esc(goalLabel)}</span><span class="chip">${esc(hrs)}</span><span class="chip">${esc(budget)}</span><span class="chip">${state.face==='no'?'不想露臉':'可評估露臉'}</span></div><div class="notice"><b>先記住這句話：</b>你的身分是素材，你的多個經營目標提供不同發展方向，觀眾關心的問題決定開場。先評估做不做得到，再用實際作品測試。</div>`;
let cards=keys.map((k,i)=>{let c=catalog[k],list=hooks(k),notes=warnings(k);let difficult=(k==='store'||k==='fashion')&&state.budget==='low'||k==='store'&&state.outside==='no';return `<article class="result"><div class="tag">推薦探索 ${i+1} ${difficult?'｜請先評估成本':'｜可先測試'}</div><h3>${esc(c.title)}</h3><p>${esc(c.why)}</p><div class="cost"><span>💰 金錢成本：${c.cost}</span><span>⏱️ 時間成本：${c.time}</span><span>📷 ${c.batch}</span></div><b>可以直接參考的 3 種開場：</b>${list.map((s,j)=>`<div class="hook">${j+1}. ${esc(s)}</div>`).join('')}<div class="mini"><strong>執行提醒</strong>${esc(difficult?'你目前的預算或外出條件，可能不利於這個方向的持續製作。可以縮小題材或先測試低成本替代版本。':'先用現有素材與固定場景拍攝，不需要一次追求完美。')}</div>${notes.length?`<details style="margin-top:12px"><summary>⚠️ 這個方向要注意什麼？</summary><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`:''}</article>`}).join('');
let extra=`<div class="card" style="margin-top:18px;background:#f8fbfd"><h3>🧠 觀眾視角：把日常換成有理由觀看的開場</h3><div class="two"><div class="mini"><strong>一般的生活紀錄</strong>今天分享一道溫暖的料理<br>今天記錄保險業務的一天<br>今天帶狗狗出去玩</div><div class="mini"><strong>換成有數字、結果、差異的切角</strong>這道菜陪我瘦了 5 公斤<br>少買一個保險，我真的會虧 30 萬嗎？<br>300 元的 3 款狗零食，哪款比較划算？</div></div><p class="small">示範重點是開場結構；任何個人經驗、數字、健康或金融效果都必須真實、可查證，不能為了吸睛編造。</p></div><div class="card"><h3>💸 你喜歡的題材，真的做得久嗎？</h3><div class="two"><div class="mini"><strong>較容易控制成本</strong>居家食譜、心理測驗、居家跳操、超商／全聯商品比較、固定場景教學</div><div class="mini"><strong>通常需要更多資源</strong>餐廳與親子景點探店、旅行、持續購買新衣的穿搭、需要多人或客戶配合的工作日常</div></div><p>想探店沒有問題。也可以先從全聯精選、7-Eleven 飲料開箱開始，試試看自己是否能穩定產出。想做穿搭，可以先用衣櫃現有衣服拍攝。</p></div><div class="notice"><b>還沒信心，也沒關係。</b>「我怕拍不好」不是判定你不適合的證據。先選一個能做出來的題目，試拍、觀察，再調整。真正適不適合，要靠測試才知道。</div><div class="nav"><button class="btn secondary" id="back">← 修改答案</button><button class="btn" id="copy">複製報告</button></div><div class="nav"><button class="btn secondary" id="restart">重新探索</button><button class="btn secondary" id="swap">換一組方向</button></div><p class="small">提醒：此遊戲為導流課的定位思考練習，推薦來自預設的跨領域案例規則，不是 AI 即時診斷，也不是流量保證。後續仍需實際拍攝、比較數據與持續調整。</p>`;return `<div id="summary">${head}${cards}${extra}</div>`}
